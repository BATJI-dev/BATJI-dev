    <text x="500" y="141" fill="#95c8f7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">02 / DESKTOP</text>
    <text x="500" y="164" fill="#f4f0fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Лаунчер</text>
    <text x="444" y="207" fill="#a7cff3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">C# · .NET</text>
    <text x="444" y="237" fill="#aaa5b9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Вход, обновления и сборки</text>
  </g>
  <g>
    <rect x="808" y="104" width="360" height="166" rx="12" fill="#171e1c" stroke="#9fce9d" stroke-opacity=".42"/>
    <rect x="808" y="104" width="360" height="3" rx="1.5" fill="url(#game)"/>
    <g transform="translate(832 132)" shape-rendering="crispEdges">
      <rect x="3" y="1" width="30" height="10" fill="#9fce9d"/>
      <rect x="3" y="11" width="30" height="11" fill="#8a684e"/>
      <rect x="3" y="22" width="30" height="10" fill="#674f43"/>
      <rect x="7" y="4" width="7" height="5" fill="#c6e4b9"/>
      <rect x="19" y="4" width="9" height="5" fill="#7eaf82"/>
      <rect x="10" y="16" width="5" height="5" fill="#a98767"/>
      <rect x="22" y="25" width="6" height="5" fill="#8c6b58"/>
