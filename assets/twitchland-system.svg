    <text x="888" y="141" fill="#a6d0a4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">03 / GAME</text>
    <text x="888" y="164" fill="#f4f0fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Minecraft</text>
    <text x="832" y="207" fill="#b4d4ae" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Java · Purpur · Towny API</text>
    <text x="832" y="237" fill="#aaa5b9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Плагины и серверные механики</text>
