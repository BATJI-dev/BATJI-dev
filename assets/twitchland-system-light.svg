    <text x="888" y="141" fill="#486f4f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">03 / GAME</text>
    <text x="888" y="164" fill="#251f30" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650">Minecraft</text>
    <text x="832" y="207" fill="#526d53" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Java · Purpur · Towny API</text>
    <text x="832" y="237" fill="#655e70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Плагины и серверные механики</text>
  </g>
